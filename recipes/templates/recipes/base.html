<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Food Planner{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #222;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
        }

        .add-button {
            background: #222;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }

        .add-button:hover {
            background: #444;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .page-title {
            margin-bottom: 8px;
            font-size: 36px;
        }

        .page-description {
            color: #777;
            margin-bottom: 35px;
        }

        .recipes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #e9e9e9;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .category {
            display: inline-block;
            background: #f0f0f0;
            color: #555;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        .info {
            display: flex;
            gap: 15px;
            margin: 18px 0;
            font-size: 14px;
            color: #555;
        }

        .button {
            display: inline-block;
            background: #222;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            text-decoration: none;
        }

        .button:hover {
            background: #444;
        }

        .recipe-page {
            background: white;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #e5e5e5;
        }

        .nutrition {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .nutrition div {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 9px;
            text-align: center;
        }

        .nutrition strong {
            font-size: 20px;
        }

        .recipe-section {
            margin-top: 30px;
        }

        .recipe-section h2 {
            margin-bottom: 10px;
        }

        .recipe-text {
            white-space: pre-line;
            line-height: 1.7;
            color: #555;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #e5e5e5;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #222;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
}

        button:hover {
            background: #444;
        }

        @media (max-width: 800px) {
            .recipes {
                grid-template-columns: 1fr;
            }

            .nutrition {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="{% url 'home' %}" class="logo">
        🍴 Food Planner
    </a>

    <a href="{% url 'recipe_create' %}" class="add-button">
        + Добавить рецепт
    </a>

</header>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
